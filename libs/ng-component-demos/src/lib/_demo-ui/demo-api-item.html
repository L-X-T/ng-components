<span class="ngc-demo-api__cell ngc-demo-api__cell--name" role="cell">
  <code>{{ name() }}</code>
  @if (kind(); as apiKind) {
    <span class="ngc-demo-api__kind">{{ apiKind }}</span>
  }
</span>
<!-- Empty cells read "none" instead of "en dash". -->
<span class="ngc-demo-api__cell" role="cell" [attr.aria-label]="type() ? null : 'none'"
  ><code>{{ type() ?? '–' }}</code></span
>
<span class="ngc-demo-api__cell" role="cell" [attr.aria-label]="default() ? null : 'none'"
  ><code>{{ default() ?? '–' }}</code></span
>
<span class="ngc-demo-api__cell" role="cell">{{ description() ?? '' }}</span>
