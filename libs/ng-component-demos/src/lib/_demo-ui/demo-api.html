<!-- Complete ARIA table grammar: header cells live in
     their own row, and every cell carries an explicit role – required because
     the visual layout is a CSS grid, not a native table. -->
<span class="ngc-demo-api__row" role="row">
  <span class="ngc-demo-api__cell ngc-demo-api__cell--head" role="columnheader">Name</span>
  <span class="ngc-demo-api__cell ngc-demo-api__cell--head" role="columnheader">Type</span>
  <span class="ngc-demo-api__cell ngc-demo-api__cell--head" role="columnheader">Default</span>
  <span class="ngc-demo-api__cell ngc-demo-api__cell--head" role="columnheader">Description</span>
</span>
<ng-content />
