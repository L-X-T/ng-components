<header class="ngc-demo-page__header">
  <h1 class="ngc-demo-page__title">{{ resolvedTitle() }}</h1>
  @if (resolvedSummary(); as summaryText) {
    <p class="ngc-demo-page__summary">{{ summaryText }}</p>
  }
</header>

<div class="ngc-demo-page__body">
  <!-- The app shell owns the <main> landmark – a nested main is a violation (review 2026-10-04 D-06). -->
  <div class="ngc-demo-page__main">
    <ng-content />

    @if (previous || next) {
      <nav class="ngc-demo-page__pager" aria-label="Adjacent components">
        @if (previous; as previousEntry) {
          <a ngc-button variant="outline" [routerLink]="previousEntry.route">← {{ previousEntry.name }}</a>
        } @else {
          <span aria-hidden="true"></span>
        }
        @if (next; as nextEntry) {
          <a ngc-button variant="outline" [routerLink]="nextEntry.route">{{ nextEntry.name }} →</a>
        }
      </nav>
    }
  </div>
  <aside class="ngc-demo-page__aside">
    <ngc-demo-on-this-page />
  </aside>
</div>
