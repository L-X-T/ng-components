<!doctype html>
<html lang="en" data-theme="neutral">
  <head>
    <meta charset="utf-8" />
    <title>ng-components – Angular component library</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ng-components – a shadcn-style Angular component library: composable, token-themed, plain SCSS, built-in palettes in light, dark and auto mode."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- No-flash theme restore: apply a persisted palette and explicit mode
         before first paint (no data-theme-mode means auto – CSS follows the
         OS). Keys, values, and the migration of the old flat theme ids must
         match NgcThemeService (NGC_THEME_STORAGE_KEY /
         NGC_THEME_MODE_STORAGE_KEY / NGC_PALETTES / NGC_THEME_MODES) –
         guarded by theme-init-script.spec.ts. -->
    <script>
      (function () {
        var legacy = {
          light: ['neutral', 'light'],
          dark: ['neutral', 'dark'],
          'angular-light': ['angular', 'light'],
          'angular-dark': ['angular', 'dark'],
        };
        var palette = null;
        var mode = null;
        try {
          var stored = localStorage.getItem('ngc-theme');
          if (stored && legacy.hasOwnProperty(stored)) {
            localStorage.setItem('ngc-theme', legacy[stored][0]);
            localStorage.setItem('ngc-theme-mode', legacy[stored][1]);
          }
          palette = localStorage.getItem('ngc-theme');
          mode = localStorage.getItem('ngc-theme-mode');
        } catch (e) {
          /* storage unavailable – keep the static palette in auto mode */
        }
        if (['neutral', 'angular', 'favorite'].indexOf(palette) !== -1) {
          document.documentElement.setAttribute('data-theme', palette);
        }
        if (['light', 'dark'].indexOf(mode) !== -1) {
          document.documentElement.setAttribute('data-theme-mode', mode);
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
