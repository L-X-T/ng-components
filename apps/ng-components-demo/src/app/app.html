<div class="shell" [class.shell--sidebar-open]="sidebarOpen()">
  <header class="shell__header">
    <button
      ngc-button
      variant="ghost"
      size="icon"
      type="button"
      class="shell__menu-button"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="sidebarOpen()"
      (click)="toggleSidebar()"
    >
      <svg
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <a class="shell__logo" routerLink="/" (click)="closeSidebar()">
      <span class="shell__logo-mark" aria-hidden="true">ngc</span>
      <span class="shell__logo-text">ng-components</span>
    </a>

    <div class="shell__header-actions">
      <button
        #searchTrigger
        type="button"
        class="shell__search"
        [ngc-dialog-trigger]="commandPalette"
        (click)="paletteOpen.set(true)"
        (closed)="paletteOpen.set(false)"
      >
        <span>Search…</span>
        <kbd class="shell__search-kbd">⌘K</kbd>
      </button>

      <button
        ngc-select
        class="shell__theme-select"
        aria-label="Theme"
        [value]="themeService.theme()"
        (valueChange)="onThemeChange($event)"
      >
        @for (theme of themes; track theme) {
          <ngc-select-option [value]="theme">{{ theme }}</ngc-select-option>
        }
      </button>

      <a
        ngc-button
        variant="ghost"
        size="icon"
        class="shell__github"
        href="https://github.com/L-X-T/angular-software"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub repository"
      >
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
          />
        </svg>
      </a>
    </div>
  </header>

  <div class="shell__body">
    <nav class="shell__sidebar" aria-label="Components">
      @for (group of categories; track group.category) {
        <p class="shell__nav-category">{{ group.category }}</p>
        <ul class="shell__nav-list">
          @for (demo of group.demos; track demo.id) {
            <li>
              <a
                class="shell__nav-link"
                [routerLink]="demo.route"
                routerLinkActive="shell__nav-link--active"
                (click)="closeSidebar()"
              >
                <span>{{ demo.name }}</span>
                @if (demo.status !== 'stable') {
                  <span ngc-badge variant="secondary" class="shell__nav-status">{{ demo.status }}</span>
                }
              </a>
            </li>
          }
        </ul>
      } @empty {
        <p class="shell__nav-empty">No components yet.</p>
      }
    </nav>

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>

<ng-template #commandPalette let-close="close">
  <div ngc-dialog-overlay class="shell__palette-overlay">
    <div ngc-dialog class="shell__palette" aria-label="Search components">
      <app-command-palette [closeDialog]="close" />
    </div>
  </div>
</ng-template>
